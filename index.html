<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- 이 페이지가 불러올 수 있는 곳을 제한 (스크립트는 같은 사이트, 데이터는 Apps Script만) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>태블릿 현황</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div class="app-container">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-shrink-0 flex-wrap gap-2">
      <div>
        <h2 class="text-secondary fw-bold m-0">📱 태블릿 현황</h2>
        <div id="fileInfo" class="small text-muted"></div>
        <!-- 폴더는 관리자 3명에게만 공유되어 있어, 다른 사람은 눌러도 '액세스 권한 필요'만 보입니다 -->
        <a class="small" href="https://drive.google.com/drive/folders/1qQdGljWkQoomC96Vw6sKbCqzI_Qngja_?usp=sharing"
           target="_blank" rel="noopener noreferrer">📁 관리자: MDM 단말 목록 파일 올리기</a>
        <span class="small text-muted">— MDM에서 전체 단말 정보를 엑셀로 다운로드하여 이 폴더에 넣어 주세요.</span>
      </div>
      <div id="toolbar" class="d-none">
        <button class="btn btn-outline-secondary me-2" id="resetBtn" type="button">📊 전체보기</button>
        <button class="btn btn-primary me-2" id="reloadBtn" type="button">🔄 데이터 새로고침</button>
        <button class="btn btn-outline-dark d-none" id="lockBtn" type="button">🔒 잠그기</button>
      </div>
    </div>

    <form id="codeForm" class="card shadow-sm border-0 p-4 mx-auto w-100 d-none">
      <label for="codeInput" class="form-label fw-bold">접속 코드를 입력하세요.</label>
      <input type="password" class="form-control mb-2" id="codeInput" autocomplete="current-password" maxlength="100">
      <div class="form-text mb-3">한 번 들어오면 이 브라우저에서는 다시 묻지 않습니다. 공용 컴퓨터에서는 다 본 뒤 🔒 잠그기를 눌러 주세요.</div>
      <div id="codeError" class="text-danger small mb-2 d-none"></div>
      <button type="submit" class="btn btn-primary">들어가기</button>
    </form>

    <div id="loading" class="loading d-none">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
      <span class="ms-3 text-secondary">데이터를 실시간 집계 중입니다...</span>
    </div>

    <div id="error" class="alert alert-danger d-none">
      <div id="errorText" class="mb-2"></div>
      <button class="btn btn-sm btn-outline-danger" id="retryBtn" type="button">다시 시도</button>
    </div>

    <div id="dashboard" class="row g-3 main-dashboard d-none">

      <div class="col-lg-5 col-md-6 h-100">
        <div class="card full-height-card">
          <div class="card-header bg-success">🏢 1단계: 조직 선택</div>
          <div class="card-body card-body-scroll p-0">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light sticky-top">
                <tr><th>조직명</th><th class="text-end px-3">수량</th></tr>
              </thead>
              <tbody id="org-list"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-7 col-md-6 h-100 d-flex flex-column right-col">

        <div class="card full-height-card half">
          <div class="card-header bg-primary" id="model-card-header">📱 2단계: 모델 선택 (전체)</div>
          <div class="card-body card-body-scroll p-0">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light sticky-top">
                <tr><th>모델명</th><th class="text-end px-3">수량</th></tr>
              </thead>
              <tbody id="model-list"></tbody>
            </table>
          </div>
        </div>

        <div class="card full-height-card half">
          <div class="card-header bg-dark text-warning" id="user-card-header">👤 사용자 명단</div>
          <div class="card-body card-body-scroll bg-white p-3">
            <div id="user-list" class="d-flex flex-wrap align-content-start"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
